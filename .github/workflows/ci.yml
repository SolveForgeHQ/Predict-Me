name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    runs-on: ubuntu-latest
    if: "contains(github.event.pull_request.changed_files, 'apps/web/') || contains(github.event.push.commits.*.modified, 'apps/web/')"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install
      - run: pnpm --filter web build

  backend:
    runs-on: ubuntu-latest
    if: "contains(github.event.pull_request.changed_files, 'backend/') || contains(github.event.push.commits.*.modified, 'backend/')"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install
      # placeholder check since there is no test script yet

  stellar:
    runs-on: ubuntu-latest
    if: "contains(github.event.pull_request.changed_files, 'blockchain/stellar/') || contains(github.event.push.commits.*.modified, 'blockchain/stellar/')"
    steps:
      - uses: actions/checkout@v4
      # Placeholder for stellar-cli test

  avalanche:
    runs-on: ubuntu-latest
    if: "contains(github.event.pull_request.changed_files, 'blockchain/avalanche/') || contains(github.event.push.commits.*.modified, 'blockchain/avalanche/')"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd blockchain/avalanche/contracts && forge build
