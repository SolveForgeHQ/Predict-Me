name = "predict-me-backend"
compatibility_date = "2024-12-24"
main = "src/index.ts"

# Development-only placeholder. For production, set JWT_SECRET via:
#   wrangler secret put JWT_SECRET
[vars]
JWT_SECRET = "dev-secret-change-me-in-production"
SOROBAN_RPC_URL = "https://soroban-testnet.stellar.org"
MARKET_CONTRACT_ID = "CCGM6LQRQNQGMUXMXHICCH73CDBYOTMV5LEJ7JWWXUBXLRFZJCPAHHXI"
AVALANCHE_RPC_URL = "https://api.avax-test.network/ext/bc/C/rpc"
AVALANCHE_CONTRACT_ADDRESS = "0x49835b6ad67dB224413Ef53A52cFAa19391F20AC"
# Comma-separated list of allowed frontend origins. Override in production
# via `wrangler secret put FRONTEND_ORIGIN`.
FRONTEND_ORIGIN = "http://localhost:3000"
SONIC_RPC_URL = "https://rpc.testnet.soniclabs.com"
SONIC_CONTRACT_ADDRESS = "0x25D035CB295d94A073107aAB9Ac86a3655a5614E"
SONIC_TOKEN_ADDRESS = "0x96Ef7Fb36E31445920EFC305Cc0D9C0288af7D02"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "predict-me-db"
database_id = "34402d4b-3454-406f-aef4-e36aa9ae2cd8"
